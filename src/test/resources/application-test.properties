# Perfil "test": solo cambia lo que difiere de src/main/resources/application.properties.

# Base en memoria: cada ejecucion de pruebas arranca vacia, Flyway crea las tablas con V1
# y nunca se toca la carpeta ./data
spring.datasource.url=jdbc:h2:mem:inventiqtest;DB_CLOSE_DELAY=-1

# En pruebas no hace falta la consola web ni imprimir cada SQL
spring.h2.console.enabled=false
spring.jpa.show-sql=false
