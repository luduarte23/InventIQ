# Perfil "demo": datos de ejemplo para probar y presentar la aplicaci\u00f3n (C4).
# Se activa con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo

# Base aparte (./data/inventiq-demo) para no mezclar los datos demo con los de desarrollo.
spring.datasource.url=jdbc:h2:file:./data/inventiq-demo

# Adem\u00e1s de las migraciones normales, Flyway lee db/demo (solo con este perfil).
spring.flyway.locations=classpath:db/migration,classpath:db/demo