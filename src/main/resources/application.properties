spring.application.name=inventiq

# Configuraci\u00f3n H2 en archivo (persistencia en directorio ./data)
spring.datasource.url=jdbc:h2:file:./data/inventiqdb
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate (valida el esquema contra las tablas creadas por Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Notificador de WhatsApp: "log" escribe los mensajes en el log (A6). Con Twilio ser\u00e1 "twilio".
inventiq.notifier=log