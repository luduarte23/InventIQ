spring.application.name=inventiq

# Configuraci\u00f3n H2 en archivo (persistencia en directorio ./data)
spring.datasource.url=jdbc:h2:file:./data/inventiqdb
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate (valida el esquema contra las tablas creadas por Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Notificador de WhatsApp: "log" escribe los mensajes en el log (A6). Con Twilio ser\u00e1 "twilio".
inventiq.notifier=log

# Usuarios iniciales (A7): se crean al arrancar si no existen. Contrase\u00f1as solo para desarrollo;
# en producci\u00f3n se reemplazan con las variables de entorno
# INVENTIQ_INITIALUSERS_ADMINPASSWORD e INVENTIQ_INITIALUSERS_CASHIERPASSWORD.
inventiq.initial-users.admin-password=admin123
inventiq.initial-users.cashier-password=cajero123