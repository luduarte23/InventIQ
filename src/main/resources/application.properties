spring.application.name=inventiq

# H2 embebida en archivo: se crea sola en ./data al arrancar (no requiere instalar nada).
spring.datasource.url=jdbc:h2:file:./data/inventiq
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo maneja solo Flyway; Hibernate únicamente valida que las entidades coincidan.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
