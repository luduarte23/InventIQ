<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ventas')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>

<main class="contenido">
    <h1>Ventas</h1>

    <!-- Mensajes que manda el controlador después de cada acción -->
    <p class="mensaje error" th:if="${error}" th:text="${error}">Error</p>
    <p class="mensaje aviso" th:if="${message}" th:text="${message}">Mensaje</p>

    <!-- El lector de código escribe el número y envía Enter: eso manda este formulario.
         'autofocus' deja el cursor en el campo cada vez que la página se recarga. -->
    <form method="post" th:action="@{/pos/scan}" class="formulario-linea">
        <label>Código de barras
            <input type="text" name="barcode" autofocus required autocomplete="off">
        </label>
        <label>Cantidad
            <input type="number" name="quantity" value="1" min="1" required>
        </label>
        <button type="submit">Agregar</button>
    </form>

    <p th:if="${sale == null}">No hay una venta en curso. Escanea un producto para empezar.</p>

    <div th:if="${sale != null}">
        <div class="tabla-scroll">
            <table>
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="line : ${sale.lines}">
                    <td th:text="${line.productName()}">Yogur de fresa</td>
                    <td th:text="${line.quantity()}">2</td>
                    <td th:text="${'$ ' + line.unitPrice()}">$ 3200.00</td>
                    <td th:text="${'$ ' + line.subtotal()}">$ 6400.00</td>
                </tr>
                </tbody>
            </table>
        </div>
        <h2 th:text="${'Total: $ ' + sale.total}">Total: $ 6400.00</h2>

        <div class="acciones">
            <form method="post" th:action="@{/pos/finish}">
                <button type="submit">Terminar venta</button>
            </form>
            <form method="post" th:action="@{/pos/cancel}">
                <button type="submit" class="secundario">Cancelar venta</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
