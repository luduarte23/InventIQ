<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>

<main class="contenido">
    <h1 th:text="${productId == null} ? 'Nuevo producto' : 'Editar producto'">Nuevo producto</h1>
    <p class="mensaje error" th:if="${error}" th:text="${error}">Error</p>

    <!-- Si productId es null se crea (POST /products); si no, se edita (POST /products/{id}). -->
    <form method="post" th:object="${form}"
          th:action="${productId == null} ? @{/products} : @{/products/{id}(id=${productId})}">
        <label>Código de barras <input type="text" th:field="*{barcode}" required></label>
        <label>Nombre <input type="text" th:field="*{name}" required></label>
        <label>Precio de venta <input type="number" th:field="*{salePrice}" min="0" step="0.01" required></label>
        <label>Costo unitario <input type="number" th:field="*{unitCost}" min="0" step="0.01" required></label>
        <label>Stock de seguridad <input type="number" th:field="*{safetyStock}" min="0" required></label>
        <label>Proveedor
            <select th:field="*{supplierId}">
                <option value="">Sin proveedor</option>
                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}">Alpina</option>
            </select>
        </label>
        <label><input type="checkbox" th:field="*{perishable}" style="width: auto;"> Es perecedero (pide fecha de vencimiento al recibirlo)</label>

        <div class="acciones">
            <button type="submit">Guardar</button>
            <a th:href="@{/products}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
