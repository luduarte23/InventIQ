<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>

<main class="contenido">
    <h1>Pedidos</h1>
    <p class="mensaje aviso" th:if="${notice}" th:text="${notice}">Mensaje</p>
    <p class="mensaje error" th:if="${error}" th:text="${error}">Error</p>

    <p th:if="${orders.isEmpty()}">No hay pedidos. Se crean en Reabastecimiento con "Generar borradores".</p>

    <div class="tabla-scroll" th:unless="${orders.isEmpty()}">
        <table>
            <thead>
            <tr><th>Pedido</th><th>Proveedor</th><th>Estado</th><th>Total</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${'#' + o.id}">#4</td>
                <td th:text="${o.supplierId == null} ? 'Por revisar: sin proveedor' : ${supplierNames[o.supplierId]}">Alpina</td>
                <td>
                    <span th:text="${o.status}">DRAFT</span>
                    <span th:if="${o.deferredByBudget}"> · fuera del presupuesto</span>
                </td>
                <td th:text="${'$ ' + o.totalCost}">$ 21000.00</td>
                <td>
                    <div class="acciones">
                        <a th:href="@{/orders/{id}(id=${o.id})}">Ver</a>
                        <!-- NFR-02: aprobar desde la lista, sin entrar al detalle. -->
                        <form method="post" th:action="@{/orders/{id}/approve(id=${o.id})}"
                              th:if="${o.status.name() == 'DRAFT'}">
                            <button type="submit">Aprobar</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
