<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventIQ - Iniciar sesión</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f7; margin: 0; }
        .caja { max-width: 340px; margin: 80px auto; background: #ffffff; padding: 28px;
                border: 1px solid #d5d9e0; border-radius: 8px; }
        h1 { margin: 0 0 4px 0; font-size: 26px; }
        p.subtitulo { margin: 0 0 20px 0; color: #5a6270; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 5px;
                border: 1px solid #b8bec9; border-radius: 4px; font-size: 15px; }
        button { width: 100%; margin-top: 22px; padding: 10px; border: none; border-radius: 4px;
                 background: #1f5fbf; color: #ffffff; font-size: 16px; cursor: pointer; }
        .mensaje { padding: 9px; border-radius: 4px; margin-bottom: 6px; }
        .error { background: #fde8e8; color: #9b1c1c; }
        .aviso { background: #e6f4ea; color: #1e6b34; }
    </style>
</head>
<body>
<div class="caja">
    <h1>InventIQ</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <div class="mensaje error" th:if="${param.error}">Usuario o contraseña incorrectos</div>
    <div class="mensaje aviso" th:if="${param.logout}">Sesión cerrada</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
