<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Íconos de trazo, 24x24, dibujados para InventIQ (sin dependencias externas).
  Uso: <svg th:replace="~{fragments/icons :: icon('cart')}"></svg>
  Toman el color del texto (currentColor) y el tamaño de .icon en app.css.
-->
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"
     th:switch="${name}">
    <path th:case="'menu'" d="M4 6h16M4 12h16M4 18h16"/>
    <g th:case="'home'">
        <path d="M3 10.5 12 3l9 7.5"/>
        <path d="M5 9.5V21h14V9.5"/>
        <path d="M10 21v-6h4v6"/>
    </g>
    <g th:case="'cart'">
        <circle cx="9" cy="20" r="1.4"/>
        <circle cx="18" cy="20" r="1.4"/>
        <path d="M2.5 3.5h2.6l2.5 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 7H6"/>
    </g>
    <g th:case="'box'">
        <path d="M21 8 12 3 3 8v8l9 5 9-5z"/>
        <path d="m3 8 9 5 9-5"/>
        <path d="M12 13v8"/>
    </g>
    <g th:case="'refresh'">
        <path d="M20 12a8 8 0 0 1-14.3 4.9"/>
        <path d="M4 12a8 8 0 0 1 14.3-4.9"/>
        <path d="M18.5 3v4.2h-4.2"/>
        <path d="M5.5 21v-4.2h4.2"/>
    </g>
    <g th:case="'clipboard'">
        <rect x="5" y="4.5" width="14" height="16.5" rx="2"/>
        <path d="M9 4.5V3h6v1.5"/>
        <path d="M9 11h6M9 15h4"/>
    </g>
    <g th:case="'tag'">
        <path d="M3 12.6V4a1 1 0 0 1 1-1h8.6L21 11.4 12.4 20z"/>
        <circle cx="7.5" cy="7.5" r="1.4"/>
    </g>
    <g th:case="'chart'">
        <path d="M3 21h18"/>
        <path d="M6 18v-6M10.5 18V8M15 18v-4M19.5 18V5"/>
    </g>
    <g th:case="'edit'">
        <path d="M4 20h4.5L19 9.5 14.5 5 4 15.5z"/>
        <path d="m13 6.5 4.5 4.5"/>
    </g>
    <g th:case="'pause'">
        <rect x="6.5" y="5" width="3.5" height="14" rx="1"/>
        <rect x="14" y="5" width="3.5" height="14" rx="1"/>
    </g>
    <path th:case="'play'" d="M7 4.5v15l12.5-7.5z"/>
    <g th:case="'layers'">
        <path d="M12 3 2.5 8 12 13l9.5-5z"/>
        <path d="m2.5 12.5 9.5 5 9.5-5"/>
        <path d="m2.5 17 9.5 5 9.5-5"/>
    </g>
    <g th:case="'clock'">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3.5 2"/>
    </g>
    <g th:case="'search'">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
    </g>
    <g th:case="'alert'">
        <path d="M12 3.5 2.5 20h19z"/>
        <path d="M12 10v4.5"/>
        <path d="M12 17.3v.2"/>
    </g>
    <path th:case="'check'" d="m5 12.5 4.5 4.5L19 7.5"/>
    <path th:case="'dash'" d="M6 12h12"/>
    <path th:case="'plus'" d="M12 5v14M5 12h14"/>
    <path th:case="'chevron'" d="m6 9 6 6 6-6"/>
    <path th:case="'close'" d="M6 6l12 12M18 6 6 18"/>
    <g th:case="'receipt'">
        <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/>
        <path d="M9 8h6M9 12h6"/>
    </g>
    <g th:case="'coins'">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 6.5v11"/>
        <path d="M15 9.2c-.6-.8-1.7-1.2-3-1.2-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.3 0-2.4-.4-3-1.2"/>
    </g>
    <g th:case="'percent'">
        <path d="M19 5 5 19"/>
        <circle cx="7" cy="7" r="2.5"/>
        <circle cx="17" cy="17" r="2.5"/>
    </g>
    <g th:case="'table'">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M3 10h18M9 10v10"/>
    </g>
    <g th:case="'barcode'">
        <path d="M4 5v14M7.5 5v14M10 5v14M13.5 5v14M16 5v14M20 5v14"/>
    </g>
    <g th:case="'arrow-left'">
        <path d="M19 12H5"/>
        <path d="m11 6-6 6 6 6"/>
    </g>
    <g th:case="'user'">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21a8 8 0 0 1 16 0"/>
    </g>
    <g th:case="'logout'">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="m16 17 5-5-5-5"/>
        <path d="M21 12H9"/>
    </g>
    <g th:case="'lock'">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </g>
    <g th:case="*">
        <circle cx="12" cy="12" r="9"/>
    </g>
</svg>
</body>
</html>
