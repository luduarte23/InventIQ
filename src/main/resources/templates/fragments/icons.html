<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Íconos de trazo 24x24 propios. Uso: <svg th:replace="~{fragments/icons :: icon('cart')}"></svg> -->
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" th:switch="${name}">
    <path th:case="'menu'" d="M4 6h16M4 12h16M4 18h16"/>
    <path th:case="'home'" d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6"/>
    <g th:case="'cart'"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
        <path d="M2.5 3.5h2.6l2.5 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 7H6"/></g>
    <path th:case="'box'" d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>
    <path th:case="'refresh'" d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/>
    <g th:case="'clipboard'"><rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9 4.5V3h6v1.5M9 11h6M9 15h4"/></g>
    <g th:case="'tag'"><path d="M3 12.6V4a1 1 0 0 1 1-1h8.6L21 11.4 12.4 20z"/><circle cx="7.5" cy="7.5" r="1.4"/></g>
    <g th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g>
    <path th:case="'alert'" d="M12 3.5 2.5 20h19zM12 10v4.5M12 17.3v.2"/>
    <g th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g>
    <path th:case="'check'" d="m5 12.5 4.5 4.5L19 7.5"/>
    <path th:case="'dash'" d="M6 12h12"/>
    <path th:case="'plus'" d="M12 5v14M5 12h14"/>
    <path th:case="'chevron'" d="m6 9 6 6 6-6"/>
    <path th:case="'close'" d="M6 6l12 12M18 6 6 18"/>
    <path th:case="'barcode'" d="M4 5v14M7.5 5v14M10 5v14M13.5 5v14M16 5v14M20 5v14"/>
    <circle th:case="*" cx="12" cy="12" r="9"/>
</svg>
</body>
</html>
