# Integración continua de InventIQ (A3).
# Compila, ejecuta las pruebas, revisa la cobertura del dominio (JaCoCo >= 80%)
# y las reglas de arquitectura (ArchUnit) en cada PR hacia main.
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y revisar cobertura
        run: ./mvnw -B -ntp verify

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          retention-days: 14