name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Solo lectura del repositorio: el CI no publica nada en GitHub.
permissions:
  contents: read

# Si llega un push nuevo al mismo PR, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El nombre del job ("build") es el check que exige la protección de main: "CI / build".
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Pruebas + ArchUnit + verificación de cobertura del dominio (falla si baja de 80%).
      - name: Build y pruebas
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # A9 (NFR-05): el JAR que dejó verify arranca con un solo comando en una carpeta vacía, sin
      # Maven ni el código fuente; en esta máquina recién creada solo se instaló Java 21.
      - name: Prueba de humo del JAR
        run: |
          chmod +x scripts/smoke-test-jar.sh
          scripts/smoke-test-jar.sh
          scripts/smoke-test-jar.sh --demo

      # Tabla de cobertura por capa en el resumen de la corrida, visible desde el PR.
      - name: Resumen de cobertura
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No se generó el reporte de cobertura (el build falló antes de las pruebas)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Cobertura de pruebas"
            echo
            echo "| Capa | Líneas | Ramas |"
            echo "|---|---|---|"
            for layer in domain application infrastructure web; do
              awk -F, -v layer="$layer" '
                NR > 1 && $2 ~ ("\\.inventiq\\." layer "(\\.|$)") {
                  lm += $8; lc += $9; bm += $6; bc += $7
                }
                END {
                  if (lm + lc == 0) exit
                  branches = (bm + bc == 0) ? "—" : sprintf("%.1f %%", 100 * bc / (bm + bc))
                  printf "| `%s` | %.1f %% (%d/%d) | %s |\n", layer, 100 * lc / (lm + lc), lc, lm + lc, branches
                }' "$CSV"
            done
            echo
            echo "El build falla si las líneas de \`domain\` bajan de 80 % (NFR-04)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      # Cada versión de main deja su JAR listo para descargar (pestaña Actions → la corrida → Artifacts).
      - name: JAR de main
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: inventiq-jar
          path: target/inventiq-*.jar
          retention-days: 30

      # Si una prueba falla, deja su salida para revisarla sin volver a correr el CI.
      - name: Reportes de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
